services:
  app:
    build: .
    image: eventregistry:latest
    container_name: event_registry_app
    ports:
      - "5000:5000"
    environment:
      - FLASK_SECRET_KEY=super_secret_lab_key_2024
      - DATABASE_URL=postgresql://eventuser:eventpass@db:5432/eventregistry
    depends_on:
      - db
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: event_registry_db
    environment:
      - POSTGRES_USER=eventuser
      - POSTGRES_PASSWORD=eventpass
      - POSTGRES_DB=eventregistry
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg_data:
